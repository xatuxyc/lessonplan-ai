
server.port=7072
server.servlet.context-path=/api
server.servlet.session.timeout=PT60M

# MySQL - 使用环境变量覆盖，默认值为本地开发用
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lessonplan?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MyBatis
mybatis.mapper-locations=classpath:com/lessonplan/mappers/*.xml

# 文件存储目录
project.folder=${FILE_STORAGE_PATH:e:/code/files/lessonplan/}

# 文件上传限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AI服务配置（当前仅Mock模式）
ai.service.mode=mock

logging.level.com.lessonplan=DEBUG
